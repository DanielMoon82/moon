<svg viewBox="0 0 1000 470" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="체중 10kg 감량 시 지방과 근육의 비율 비교"><rect width="1000" height="470" fill="#F4F6FA"/><text x="40" y="52" font-size="25" font-weight="700" fill="#0F1729" font-family="sans-serif">체중 10kg을 뺐을 때, 그중 근육은 얼마나 빠질까</text><text x="40" y="84" font-size="15" fill="#6B7891" font-family="sans-serif">GLP-1 비만치료제 사용 시 감량 체중의 구성 · 임상 보고 범위를 바탕으로 한 예시</text><rect x="40" y="106" width="14" height="14" fill="#3B82F6"/><text x="62" y="118" font-size="14" fill="#3D4A63" font-family="sans-serif">지방</text><rect x="112" y="106" width="14" height="14" fill="#E5484D"/><text x="134" y="118" font-size="14" fill="#3D4A63" font-family="sans-serif">제지방(근육·뼈·수분)</text><text x="230" y="172" text-anchor="end" font-size="17" font-weight="600" fill="#0F1729" font-family="sans-serif">약물만 사용</text><text x="230" y="196" text-anchor="end" font-size="13" fill="#6B7891" font-family="sans-serif">단백질·운동 관리 없음</text><rect x="250" y="150" width="363" height="62" fill="#3B82F6"/><rect x="613" y="150" width="242" height="62" fill="#E5484D"/><text x="431.5" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="sans-serif">지방 6kg</text><text x="734" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="sans-serif">근육 4kg</text><text x="250" y="234" font-size="14" fill="#6B7891" font-family="sans-serif">감량분의 <tspan font-weight="700" fill="#E5484D">40%</tspan>가 근육 등 제지방</text><text x="230" y="312" text-anchor="end" font-size="17" font-weight="600" fill="#0F1729" font-family="sans-serif">단백질 + 근력운동 병행</text><text x="230" y="336" text-anchor="end" font-size="13" fill="#6B7891" font-family="sans-serif">하루 단백질 1.2g/kg · 주 2~3회</text><rect x="250" y="290" width="532.4000000000001" height="62" fill="#3B82F6"/><rect x="782.4000000000001" y="290" width="72.6" height="62" fill="#E5484D"/><text x="516.2" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="sans-serif">지방 8.8kg</text><text x="865.0000000000001" y="328" font-size="16" font-weight="700" fill="#E5484D" font-family="sans-serif">근육 1.2kg</text><text x="250" y="374" font-size="14" fill="#6B7891" font-family="sans-serif">감량분의 <tspan font-weight="700" fill="#15803D">12%</tspan>가 근육 등 제지방</text><line x1="250" y1="130" x2="250" y2="392" stroke="#C6CEDB" stroke-width="1"/><text x="40" y="437" font-size="13.5" fill="#6B7891" font-family="sans-serif">임상에서 GLP-1 계열 약물의 감량분 중 제지방 비율은 대체로 20~40% 구간으로 보고됩니다.</text><text x="40" y="457" font-size="13.5" fill="#6B7891" font-family="sans-serif">단백질 섭취와 저항성 운동을 병행하면 이 비율이 크게 낮아진다는 것이 여러 연구의 공통된 결론입니다.</text></svg>