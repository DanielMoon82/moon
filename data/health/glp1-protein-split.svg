<svg viewBox="0 0 1000 530" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="하루 단백질 90g을 끼니별로 나누는 방법 비교"><rect width="1000" height="530" fill="#F4F6FA"/><text x="40" y="52" font-size="25" font-weight="700" fill="#0F1729" font-family="sans-serif">같은 하루 90g인데, 근육 합성 스위치는 몇 번 켜질까</text><text x="40" y="84" font-size="15" fill="#6B7891" font-family="sans-serif">한 끼 25g을 넘겨야 근육 합성이 작동합니다 (점선 = 25g 기준선)</text><line x1="90" y1="270" x2="960" y2="270" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="7 5"/><text x="960" y="261" text-anchor="end" font-size="13.5" font-weight="600" fill="#E5484D" font-family="sans-serif">25g 기준선</text><line x1="90" y1="360" x2="960" y2="360" stroke="#C6CEDB" stroke-width="1.2"/><rect x="120" y="324" width="66" height="36" fill="#6B7891" opacity="0.45"/><text x="153" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#6B7891" font-family="sans-serif">10g</text><text x="153" y="384" text-anchor="middle" font-size="14" fill="#3D4A63" font-family="sans-serif">아침</text><rect x="220" y="288" width="66" height="72" fill="#6B7891" opacity="0.45"/><text x="253" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#6B7891" font-family="sans-serif">20g</text><text x="253" y="384" text-anchor="middle" font-size="14" fill="#3D4A63" font-family="sans-serif">점심</text><rect x="320" y="144" width="66" height="216" fill="#15803D" opacity="1"/><text x="353" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D" font-family="sans-serif">60g</text><text x="353" y="384" text-anchor="middle" font-size="14" fill="#3D4A63" font-family="sans-serif">저녁</text><text x="253" y="422" text-anchor="middle" font-size="17" font-weight="600" fill="#0F1729" font-family="sans-serif">몰아서 먹는 경우</text><text x="253" y="450" text-anchor="middle" font-size="15" fill="#6B7891" font-family="sans-serif">근육 합성 작동 <tspan font-weight="700">1회</tspan> / 3끼</text><rect x="560" y="252" width="66" height="108" fill="#15803D" opacity="1"/><text x="593" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D" font-family="sans-serif">30g</text><text x="593" y="384" text-anchor="middle" font-size="14" fill="#3D4A63" font-family="sans-serif">아침</text><rect x="660" y="252" width="66" height="108" fill="#15803D" opacity="1"/><text x="693" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D" font-family="sans-serif">30g</text><text x="693" y="384" text-anchor="middle" font-size="14" fill="#3D4A63" font-family="sans-serif">점심</text><rect x="760" y="252" width="66" height="108" fill="#15803D" opacity="1"/><text x="793" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#15803D" font-family="sans-serif">30g</text><text x="793" y="384" text-anchor="middle" font-size="14" fill="#3D4A63" font-family="sans-serif">저녁</text><text x="693" y="422" text-anchor="middle" font-size="17" font-weight="600" fill="#0F1729" font-family="sans-serif">고르게 나눠 먹는 경우</text><text x="693" y="450" text-anchor="middle" font-size="15" fill="#15803D" font-family="sans-serif">근육 합성 작동 <tspan font-weight="700">3회</tspan> / 3끼</text><text x="40" y="512" font-size="13.5" fill="#6B7891" font-family="sans-serif">체중 60~75kg 기준 하루 90g 예시입니다. 신장질환이 있으면 단백질 증량 전 반드시 주치의와 상의하십시오.</text></svg>