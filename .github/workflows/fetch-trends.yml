name: Fetch portal trends (KR)

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Trends
        run: python3 .github/scripts/fetch-google-trends.py

      - name: Fetch portal trends
        run: python3 .github/scripts/fetch-portal-trends.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends-kr.json
          if [ -f data/portal-trends.json ]; then git add data/portal-trends.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "chore: update portal trends"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
