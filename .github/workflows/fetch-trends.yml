name: Fetch Google Trends (KR)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch trends
        run: python3 .github/scripts/fetch-google-trends.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/trends-kr.json
          git diff --staged --quiet || git commit -m "chore: update Google Trends KR data"
          git push
