name: Publish to Tistory and Naver

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "특정 글만 발행 (blog-exports 폴더 이름, 비우면 미발행분 전체)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "blog-exports/**"

permissions:
  contents: write

concurrency:
  group: publish-blogs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 스텝의 if: 에서 읽어야 해서 job 레벨에 둔다.
    # (스텝 안에 선언한 env 는 그 스텝의 if: 에서 보이지 않는다)
    env:
      # 아이디·비밀번호는 쓰지 않는다. 대시보드에서 직접 로그인해 만든
      # .publish-session/<채널>.json 을 통째로 secret 에 넣어 두면
      # CI 에서도 같은 세션으로 올린다. 없으면 해당 채널만 건너뛴다.
      TISTORY_SESSION_JSON: ${{ secrets.TISTORY_SESSION_JSON }}
      # 비워 두면 data/blog-targets.json 에 적힌 주소를 쓴다.
      TISTORY_BLOG_NAME: ${{ vars.TISTORY_BLOG_NAME }}
      NAVER_SESSION_JSON: ${{ secrets.NAVER_SESSION_JSON }}
      ONLY_SLUG: ${{ github.event.inputs.slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # 세션 파일을 복원한다. secret 이 없으면 파일도 안 생기고,
      # 그러면 아래 스텝이 알아서 건너뛴다.
      - name: Restore saved logins
        run: |
          mkdir -p .publish-session
          if [ -n "$NAVER_SESSION_JSON" ]; then
            printf '%s' "$NAVER_SESSION_JSON" > .publish-session/naver.json
            echo "네이버 세션 복원됨"
          fi
          if [ -n "$TISTORY_SESSION_JSON" ]; then
            printf '%s' "$TISTORY_SESSION_JSON" > .publish-session/tistory.json
            echo "티스토리 세션 복원됨"
          fi

      # 한쪽이 막혀도 다른 쪽은 올라가야 하므로 continue-on-error 로 둔다.
      # 마지막 단계에서 실패 여부를 모아 보고한다.
      - name: Publish to Tistory
        id: tistory
        # 비밀값이 없으면 건너뛴다. 설정하지 않은 채널 때문에 매번 빨간 실패가
        # 뜨면 진짜 고장을 알아채지 못한다.
        if: env.TISTORY_SESSION_JSON != ''
        continue-on-error: true
        run: python3 .github/scripts/publish-to-tistory.py

      - name: Publish to Naver
        id: naver
        if: env.NAVER_SESSION_JSON != ''
        continue-on-error: true
        run: python3 .github/scripts/publish-to-naver.py

      # 셀렉터가 안 맞거나 로그인이 막히면 이 스크린샷이 유일한 단서다.
      - name: Upload failure artifacts
        if: always() && hashFiles('publish-debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publish-debug
          path: publish-debug/
          retention-days: 7

      - name: Commit publish state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/blog-published.json ]; then
            git add data/blog-published.json
          fi
          git diff --staged --quiet && exit 0
          git commit -m "chore: record blog publish state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Report result
        if: always()
        run: |
          echo "티스토리: ${{ steps.tistory.outcome }}"
          echo "네이버: ${{ steps.naver.outcome }}"
          if [ "${{ steps.tistory.outcome }}" = "skipped" ] && \
             [ "${{ steps.naver.outcome }}" = "skipped" ]; then
            echo "::warning::저장된 로그인 세션이 없어 두 채널 모두 건너뛰었습니다."
            echo "내 컴퓨터에서 'python3 tools/publisher/server.py' 를 띄워 로그인한 뒤,"
            echo ".publish-session/naver.json / tistory.json 내용을"
            echo "NAVER_SESSION_JSON / TISTORY_SESSION_JSON secret 에 넣으면 여기서도 올라갑니다."
            exit 0
          fi
          if [ "${{ steps.tistory.outcome }}" = "failure" ] || \
             [ "${{ steps.naver.outcome }}" = "failure" ]; then
            echo "::warning::자동 발행이 일부 실패했습니다. publish-debug 아티팩트를 확인하세요."
            exit 1
          fi
