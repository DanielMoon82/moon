name: Publish to Tistory and Naver

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "특정 글만 발행 (blog-exports 폴더 이름, 비우면 미발행분 전체)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "blog-exports/**"

permissions:
  contents: write

concurrency:
  group: publish-blogs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # 한쪽이 막혀도 다른 쪽은 올라가야 하므로 continue-on-error 로 둔다.
      # 마지막 단계에서 실패 여부를 모아 보고한다.
      - name: Publish to Tistory
        id: tistory
        continue-on-error: true
        env:
          TISTORY_KAKAO_ID: ${{ secrets.TISTORY_KAKAO_ID }}
          TISTORY_KAKAO_PW: ${{ secrets.TISTORY_KAKAO_PW }}
          TISTORY_BLOG_NAME: ${{ vars.TISTORY_BLOG_NAME }}
          ONLY_SLUG: ${{ github.event.inputs.slug }}
        run: python3 .github/scripts/publish-to-tistory.py

      - name: Publish to Naver
        id: naver
        continue-on-error: true
        env:
          NAVER_ID: ${{ secrets.NAVER_ID }}
          NAVER_PW: ${{ secrets.NAVER_PW }}
          ONLY_SLUG: ${{ github.event.inputs.slug }}
        run: python3 .github/scripts/publish-to-naver.py

      # 셀렉터가 안 맞거나 로그인이 막히면 이 스크린샷이 유일한 단서다.
      - name: Upload failure artifacts
        if: always() && hashFiles('publish-debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publish-debug
          path: publish-debug/
          retention-days: 7

      - name: Commit publish state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/blog-published.json ]; then
            git add data/blog-published.json
          fi
          git diff --staged --quiet && exit 0
          git commit -m "chore: record blog publish state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Report result
        if: always()
        run: |
          echo "티스토리: ${{ steps.tistory.outcome }}"
          echo "네이버: ${{ steps.naver.outcome }}"
          if [ "${{ steps.tistory.outcome }}" = "failure" ] || \
             [ "${{ steps.naver.outcome }}" = "failure" ]; then
            echo "::warning::자동 발행이 일부 실패했습니다. publish-debug 아티팩트를 확인하세요."
            exit 1
          fi
