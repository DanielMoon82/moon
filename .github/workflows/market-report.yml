name: Daily market report

on:
  schedule:
    # 18:30 KST on weekdays - after the 17:00 KST stock fetch has landed
    # the confirmed investor-flow numbers for the day
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        run: python3 .github/scripts/generate-market-report.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ blogger-posts/ blog-exports/ data/latest-report.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: add daily market report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
