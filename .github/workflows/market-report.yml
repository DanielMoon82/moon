name: Daily market report

on:
  schedule:
    # 18:00 KST on weekdays — 17:00 KST 시세 수집이 그날 확정 수급을
    # 담고 난 뒤라, 외국인·기관 순매수까지 당일 값으로 실린다.
    # (수집이 밀려 전일치만 있으면 생성기가 글에 그 날짜를 밝힌다.)
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        run: python3 .github/scripts/generate-market-report.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ blogger-posts/ blog-exports/ data/latest-report.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: add daily market report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
