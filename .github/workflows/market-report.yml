name: Daily market report

on:
  schedule:
    # 16:00 KST on weekdays — 장 마감(15:30) 30분 뒤.
    # 이 시각에는 외국인·기관 수급이 아직 확정 전이라 전일 확정치가 실린다.
    # 생성기가 그 사실을 글에 밝히므로 전날 수급을 그날 것으로 읽지 않는다.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report
        run: python3 .github/scripts/generate-market-report.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ blogger-posts/ blog-exports/ data/latest-report.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: add daily market report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
