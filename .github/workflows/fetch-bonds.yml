name: Fetch bond yields (KR)

on:
  schedule:
    # 금리가 달라졌을 때만 파일을 쓰므로 자주 확인해도 커밋이 쌓이지 않는다.
    # 평일 08~18시 KST 매시 정각에 본다(UTC 로는 전날 23시부터 당일 09시).
    - cron: "0 23 * * 0-4"
    - cron: "0 0-9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch bond yields
        # 키는 없어도 돌아간다(sample 키). 있으면 한 번에 더 많이 받는다.
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python3 .github/scripts/fetch-bonds.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bonds.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update bond yields"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
