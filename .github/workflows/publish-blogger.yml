name: Publish to Blogger

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "특정 글만 발행 (파일명에서 .html 제외, 비우면 전체)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "blogger-posts/**.html"

permissions:
  contents: write

concurrency:
  group: publish-blogger
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Publish posts
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_URL: ${{ vars.BLOGGER_BLOG_URL }}
          ONLY_SLUG: ${{ github.event.inputs.slug }}
        run: python3 .github/scripts/publish-to-blogger.py

      - name: Commit publish state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/blogger-published.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: record Blogger publish state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
