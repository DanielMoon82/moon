name: Fetch broker bond list (KR)

# 장이 열린 날 오전·오후. 체결수익률이라 장중에 움직인다.
on:
  schedule:
    - cron: "0 1 * * 1-5"    # 10:00 KST
    - cron: "30 6 * * 1-5"   # 15:30 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install playwright
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 -u .github/scripts/fetch-brokerbond.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brokerbond.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update broker bond list"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
