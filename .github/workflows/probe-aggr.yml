    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # 브라우저가 필요 없다. 그냥 POST 만 던진다.
      - run: python3 -u .github/scripts/probe-aggr.py
